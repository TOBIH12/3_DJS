<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D067" />
      <stop offset="25%" stop-color="#DFAC38" />
      <stop offset="50%" stop-color="#FFF5B2" />
      <stop offset="75%" stop-color="#C7922B" />
      <stop offset="100%" stop-color="#8A5E12" />
    </linearGradient>
  </defs>

  <!-- Canvas Background: Tailwind bg-gray-900 (#111827) -->
  <rect width="800" height="240" fill="#111827" />

  <!-- Top Accent (Cropped Fleur-de-lis) -->
  <g transform="translate(400, 5) scale(0.6)" fill="url(#goldGradient)">
    <path d="M 0 0 C 4 10 11 14 11 22 C 11 29 4 32 0 35 C -4 32 -11 29 -11 22 C -11 14 -4 10 0 0 Z" />
  </g>

  <!-- Main Headline: 3_DJS -->
  <text x="400" y="150" 
        fill="url(#goldGradient)" 
        font-family="'Playfair Display', 'Times New Roman', Georgia, serif" 
        font-size="115" 
        font-weight="700" 
        letter-spacing="6" 
        text-anchor="middle">3_DJS</text>

  <!-- Bottom Divider Line & Center Accent -->
  <g stroke="url(#goldGradient)" fill="url(#goldGradient)">
    <line x1="160" y1="205" x2="380" y2="205" stroke-width="1.5" opacity="0.85"/>
    <polygon points="400,200 404,205 400,210 396,205" />
    <line x1="420" y1="205" x2="640" y2="205" stroke-width="1.5" opacity="0.85"/>
  </g>
</svg>
